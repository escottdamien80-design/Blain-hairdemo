<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blain Hair – Barber Shop</title>
  <meta name="description" content="Blain Hair – sharp cuts, clean lines. Book your barber online.">
  <meta name="theme-color" content="#121111">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cinzel:wght@500;600&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">
  <script>document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="#top" aria-label="Blain Hair home"><img src="logo.png" alt="Blain" width="770" height="176"></a>
      <a class="btn btn-light btn-sm" href="#booking">Book now</a>
    </div>
  </nav>

  <header class="hero" id="top">
    <img class="hero-bg" src="images/hero-1500.webp"
         srcset="images/hero-800.webp 800w, images/hero-1500.webp 1500w" sizes="100vw"
         width="1500" height="2000" fetchpriority="high" decoding="async"
         alt="Inside the Blain Hair barber shop: black leather barber chairs, a herringbone floor and bright strip lighting">
    <div class="container">
      <img class="hero-logo" src="logo.png" alt="Blain Hair" width="770" height="176">
      <h1>Sharp cuts.<br>Clean lines.</h1>
      <p class="tagline">Book your appointment in seconds.</p>
      <a class="btn btn-light" href="#booking">Choose your barber</a>
    </div>
  </header>

  <main>
    <section class="stats" aria-label="Blain Hair in numbers">
      <div class="stats-grid">
        <div class="stat reveal" style="--d:0s">
          <span class="stat-num" data-count="2000" data-suffix="+" aria-hidden="true">2,000<span class="sfx">+</span></span>
          <span class="visually-hidden">2,000+</span>
          <span class="stat-label">Haircuts</span>
        </div>
        <div class="stat reveal" style="--d:.12s">
          <span class="stat-num" data-count="5" data-decimals="1" data-suffix="★" aria-hidden="true">5.0<span class="sfx">★</span></span>
          <span class="visually-hidden">5.0 stars</span>
          <span class="stat-label">Google rating</span>
        </div>
        <div class="stat reveal" style="--d:.24s">
          <span class="stat-num" data-count="2" aria-hidden="true">2</span>
          <span class="visually-hidden">2</span>
          <span class="stat-label">Expert barbers</span>
        </div>
      </div>
    </section>

    <section class="gallery" aria-label="Inside Blain Hair">
      <figure class="reveal" style="--d:0s">
        <img src="images/pole-960.webp" srcset="images/pole-640.webp 640w, images/pole-960.webp 960w"
             sizes="(min-width: 768px) 480px, calc(100vw - 40px)" width="960" height="1280"
             loading="lazy" decoding="async"
             alt="Illuminated barber pole beside a glass cabinet of Slick Gorilla styling products">
      </figure>
      <figure class="reveal" style="--d:.15s">
        <img src="images/tools-960.webp" srcset="images/tools-640.webp 640w, images/tools-960.webp 960w"
             sizes="(min-width: 768px) 480px, calc(100vw - 40px)" width="960" height="1280"
             loading="lazy" decoding="async"
             alt="Stainless steel trolley with clippers, scissors, combs, brushes and a neck duster laid out neatly">
      </figure>
    </section>

    <section class="booking container" id="booking" aria-labelledby="booking-title">
      <h2 id="booking-title" class="section-title reveal">Book your cut</h2>

      <p id="notice" class="notice" role="status" aria-live="polite" hidden></p>

      <div class="step reveal" style="--d:.1s">
        <h3><span class="step-num">1</span> Choose your barber</h3>
        <div id="barbers" class="barbers" role="radiogroup" aria-label="Barbers"></div>
      </div>

      <div id="slots-step" class="step" hidden>
        <div class="step-head">
          <h3><span class="step-num">2</span> Pick a time</h3>
          <button id="next-available" class="btn btn-light btn-sm" type="button">Next available</button>
        </div>
        <div id="slots" class="slots"></div>
      </div>

      <div id="details-step" class="step" hidden>
        <h3><span class="step-num">3</span> Your details</h3>
        <p id="details-summary" class="summary"></p>
        <form id="details-form" novalidate>
          <div class="fields">
            <label>Name
              <input id="customer-name" name="name" type="text" autocomplete="name" maxlength="80" required>
            </label>
            <label>Phone
              <input id="customer-phone" name="phone" type="tel" autocomplete="tel" maxlength="20" required>
            </label>
          </div>
          <p id="form-error" class="form-error" role="alert" hidden></p>
          <div class="actions">
            <button id="confirm-booking" class="btn btn-light" type="submit">Confirm booking</button>
            <button id="cancel-booking" class="btn btn-ghost" type="button">Cancel</button>
          </div>
        </form>
      </div>

      <div id="confirmation" class="confirmation" role="status" aria-live="polite" hidden></div>
    </section>
  </main>

  <footer class="footer reveal">
    <p>&copy; <span id="year"></span> Blain Hair · Demo site – no real bookings are made.</p>
  </footer>

  <a id="sticky-book" class="btn btn-light sticky-book" href="#booking">Book now</a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="script.js"></script>
</body>
</html>
